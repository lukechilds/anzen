[package]
name = "anzen-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[patch.crates-io]
bdk_electrum = { path = "vendor/bdk_electrum" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anzen-signer-app = { path = "../../crates/anzen-signer-app" }
anzen-wallet = { path = "../../crates/anzen-wallet", default-features = false, features = ["electrum"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
# GPU benchmarks in settings, on WebGPU.
anzen-vanity = { path = "../../crates/anzen-vanity" }
zeroize = "1.8"

[profile.release]
lto = "thin"
opt-level = "s"
