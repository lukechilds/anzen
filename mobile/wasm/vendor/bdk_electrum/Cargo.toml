[package]
name = "bdk_electrum"
version = "0.23.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitcoindevkit/bdk"
description = "BDK Electrum adapter (browser-compatible dependency features)"

[dependencies]
bdk_core = "0.6.1"
electrum-client = { version = "0.24.0", default-features = false }

# Upstream unconditionally enables proxy, whose UDP implementation only builds
# on Unix/Windows. Browsers supply a WebSocket stream instead of SOCKS/TCP.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
electrum-client = { version = "0.24.0", default-features = false, features = ["proxy"] }

[features]
default = ["use-rustls"]
use-rustls = ["electrum-client/use-rustls"]
use-rustls-ring = ["electrum-client/use-rustls-ring"]
use-openssl = ["electrum-client/use-openssl"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(coverage,coverage_nightly)"]
