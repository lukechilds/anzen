name: anzen

services:
  bitcoind:
    image: bitcoin/bitcoin:28.1
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=anzen
      - -rpcpassword=anzen
      - -fallbackfee=0.00001
      - -printtoconsole=0
    healthcheck:
      test:
        - CMD
        - bitcoin-cli
        - -regtest
        - -rpcconnect=127.0.0.1
        - -rpcuser=anzen
        - -rpcpassword=anzen
        - getblockchaininfo
      interval: 1s
      timeout: 5s
      retries: 30

  demo:
    image: anzen-demo:local
    build:
      context: .
      target: runtime
    depends_on:
      bitcoind:
        condition: service_healthy
    environment: &rpc-environment
      ANZEN_RPC_URL: http://bitcoind:18443
      ANZEN_RPC_USER: anzen
      ANZEN_RPC_PASSWORD: anzen
    tmpfs:
      - /demo
    working_dir: /demo
    entrypoint: ["/opt/anzen/scripts/e2e-demo.sh"]

  tests:
    image: anzen-tests:local
    build:
      context: .
      target: test
    depends_on:
      bitcoind:
        condition: service_healthy
    environment: *rpc-environment

  cli:
    build:
      context: .
      target: runtime
    depends_on:
      bitcoind:
        condition: service_healthy
    environment: *rpc-environment
    volumes:
      - anzen-state:/data
    profiles: ["manual"]

volumes:
  anzen-state:
