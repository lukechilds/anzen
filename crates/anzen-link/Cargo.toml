[package]
name = "anzen-link"
description = "Links from a phone or computer to a hardware signer: Bluetooth to a Ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# The command protocol and the messages a hardware signer reviews. No signing happens here.
anzen-protocol.workspace = true
anzen-signer.workspace = true
btleplug = "0.13"
futures = "0.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros", "net", "io-util"] }
uuid = "1"

[dev-dependencies]
# The emulator test plays the phone: real requests, and the host MuSig2 code to check the answers.
anzen-common.workspace = true
anzen-protocol = { workspace = true, features = ["software"] }
bitcoin.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "time", "macros", "rt-multi-thread"] }
