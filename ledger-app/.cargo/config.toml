[target.nanox]
runner = "speculos -m nanox --display=headless --api-port 5001"

[target.nanosplus]
runner = "speculos -m nanosp --display=headless --api-port 5001"

[target.stax]
runner = "speculos --model stax"

[target.flex]
runner = "speculos --model flex"

[target.apex_p]
runner = "speculos --model apex_p"

[build]
target = "nanosplus"

[profile.release]
opt-level = "z"
lto = true

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# The signer rebuilds a year of transactions in memory. Stax and Flex have 36 KB of RAM for the
# heap, the stack and the app's own data.
[env]
HEAP_SIZE = "stax: 23552, flex: 23552"
