[package]
name = "anzen-ledger"
version = "0.1.0"
authors = ["Anzen developers"]
edition = "2024"
license = "MIT"
description = "Anzen cold-signer app for Ledger devices (proof of concept)"

[dependencies]
anzen-protocol = { path = "../crates/anzen-protocol" }
anzen-signer = { path = "../crates/anzen-signer" }
# The compact form requests and answers travel in.
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
ledger_device_sdk = { version = "=1.36.1", features = ["io_new", "sys"] }

[features]
default = ["ledger_device_sdk/nano_nbgl"]
# Stack and heap high-water marks, answered over the `MEMORY` command. Safe on a device.
measure = []
# Also prints them to the emulator's log. Semihosting: never load this build on a device.
debug = ["measure", "ledger_device_sdk/debug"]

[package.metadata.ledger]
# Raster launcher icons are generated from ../media/anzen-mark.svg.
curve = ["secp256k1"]
flags = "0"
path = ["86'/0'/100'", "86'/1'/100'"]
name = "Anzen"
nanosplus = { icon = "icons/anzen-14x14.png" }
nanox = { icon = "icons/anzen-14x14.png" }
stax = { icon = "icons/anzen-32x32.png" }
flex = { icon = "icons/anzen-40x40.png" }
apex_p = { icon = "icons/anzen-32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanox", "nanosplus"))'] }

# Keep device firmware out of the desktop workspace's default build and test
# graph. Ledger firmware requires custom targets and the Ledger SDK toolchain.
[workspace]
