<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anzen Flex viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0c0f;
        color: #f5f6f7;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 42%, #24262b 0, #111216 42%, #070809 76%);
      }

      .viewer {
        padding: 24px;
      }

      .device {
        position: relative;
        /* Ledger publishes 56.5 x 78.4 mm for the Flex front face. */
        width: min(283px, 82vw, calc((100vh - 48px) * 0.720663));
        aspect-ratio: 56.5 / 78.4;
        border-radius: 5.2% / 3.75%;
        background:
          linear-gradient(112deg, #74777a 0%, #55585b 5%, #3b3e41 48%, #292c2f 74%, #505356 100%);
        border: 1px solid #8a8d90;
        box-shadow:
          0 23px 39px #000c,
          0 5px 11px #0009,
          inset 1px 1px 1px #ffffff5c,
          inset -2px -2px 5px #08090bb8;
      }

      .device::before {
        content: "";
        position: absolute;
        inset: 0.7%;
        pointer-events: none;
        border: 1px solid #0b0c0e;
        border-radius: 4.8% / 3.45%;
        box-shadow: inset 0 0 0 1px #ffffff0d;
      }

      .screen-shell {
        position: absolute;
        /* The horizontal and vertical margins are both about 5.7 mm. */
        top: 7.3%;
        left: 10.1%;
        width: 79.8%;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        border-radius: 4.3% / 3.45%;
        background: #e7e7e5;
        border: 1px solid #0a0b0c;
        box-shadow:
          0 0 0 1px #111316,
          0 2px 5px #0009,
          inset 0 0 5px #0002;
        touch-action: none;
        user-select: none;
        cursor: pointer;
      }

      #screen {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
        image-rendering: auto;
        -webkit-user-drag: none;
      }

      .chin {
        position: absolute;
        left: 1.1%;
        bottom: 0.5%;
        width: 97.8%;
        height: 16.8%;
        border-radius: 7% 7% 4.8% 4.8% / 15% 15% 9% 9%;
        background:
          linear-gradient(176deg, #f1f2f2 0%, #d5d7d8 40%, #a9acae 76%, #6e7275 100%);
        border: 1px solid #8e9295;
        box-shadow:
          inset 0 1px 1px #ffffffc7,
          inset 0 -2px 3px #40434755,
          0 1px 3px #0008;
        pointer-events: none;
      }

      .ledger-mark {
        position: absolute;
        left: 7.4%;
        top: 31%;
        width: 10.2%;
        height: auto;
        color: #55595c;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
        stroke-linecap: square;
        stroke-linejoin: miter;
        filter: drop-shadow(0 0.5px 0 #fff9);
      }

      .side-button {
        position: absolute;
        top: 17.1%;
        right: -2.15%;
        width: 3.35%;
        height: 11.4%;
        padding: 0;
        border: 1px solid #676a6e;
        border-left-color: #111316;
        border-radius: 0 48% 48% 0 / 0 10% 10% 0;
        background: linear-gradient(90deg, #111316 0%, #45484d 42%, #7b7e81 72%, #292c30 100%);
        box-shadow: 4px 4px 8px #000a, inset 0 1px 1px #ffffff52;
        cursor: pointer;
      }

      .side-button::before {
        content: "";
        position: absolute;
        inset: -24% -85%;
      }

      .side-button:hover { filter: brightness(1.18); }
      .side-button:active,
      .side-button.pressed {
        right: -1.5%;
        filter: brightness(0.8);
        box-shadow: 2px 2px 5px #000b;
      }

      @media (max-width: 600px) {
        .viewer { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main class="viewer">
      <section id="device" class="device" aria-label="Ledger Flex emulator">
        <div id="screen-shell" class="screen-shell" aria-label="Interactive Flex screen">
          <img id="screen" alt="Flex framebuffer" draggable="false">
        </div>
        <div class="chin" aria-hidden="true">
          <svg class="ledger-mark" viewBox="0 0 32 32">
            <path d="M10 2.5H2.5V10 M22 2.5h7.5V10 M2.5 22v7.5H10 M22 29.5h7.5V22 M11.5 10.5v10h9"/>
          </svg>
        </div>
        <button id="side-button" class="side-button" type="button" aria-label="Flex side button" title="Flex side button"></button>
      </section>
    </main>

    <script>
      const WIDTH = 480;
      const HEIGHT = 600;
      const screen = document.querySelector("#screen");
      const screenShell = document.querySelector("#screen-shell");
      const sideButton = document.querySelector("#side-button");
      const device = document.querySelector("#device");
      let pointerStart = null;
      let pointerCurrent = null;
      let pointerPress = null;
      let activePointerId = null;
      let refreshing = false;
      let currentFrameUrl = null;

      function setConnection(online) {
        device.dataset.connected = String(online);
      }

      async function post(path, body) {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || `${response.status} ${response.statusText}`);
        }
      }

      async function refreshFrame() {
        if (refreshing) return;
        refreshing = true;
        try {
          const response = await fetch(`/api/frame?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
          const nextFrameUrl = URL.createObjectURL(await response.blob());
          const oldFrameUrl = currentFrameUrl;
          screen.onload = () => {
            if (oldFrameUrl) URL.revokeObjectURL(oldFrameUrl);
          };
          currentFrameUrl = nextFrameUrl;
          screen.src = nextFrameUrl;
          setConnection(true);
        } catch (error) {
          setConnection(false);
        } finally {
          refreshing = false;
        }
      }

      function devicePoint(event) {
        const bounds = screenShell.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(WIDTH - 1, Math.round((event.clientX - bounds.left) * WIDTH / bounds.width))),
          y: Math.max(0, Math.min(HEIGHT - 1, Math.round((event.clientY - bounds.top) * HEIGHT / bounds.height))),
        };
      }

      screenShell.addEventListener("pointerdown", (event) => {
        if (pointerStart) return;
        event.preventDefault();
        screenShell.setPointerCapture(event.pointerId);
        activePointerId = event.pointerId;
        pointerStart = devicePoint(event);
        pointerCurrent = pointerStart;
        pointerPress = post("/api/finger", {
          action: "press",
          x: pointerStart.x,
          y: pointerStart.y,
        }).then(
          () => null,
          (error) => error,
        );
      });

      screenShell.addEventListener("pointermove", (event) => {
        if (!pointerStart || event.pointerId !== activePointerId) return;
        pointerCurrent = devicePoint(event);
      });

      async function releasePointer(event) {
        if (!pointerStart || (event && event.pointerId !== activePointerId)) return;
        const end = event ? devicePoint(event) : pointerCurrent;
        const press = pointerPress;
        pointerStart = null;
        pointerCurrent = null;
        pointerPress = null;
        activePointerId = null;
        try {
          const pressError = await press;
          if (pressError) throw pressError;
          await post("/api/finger", {
            action: "release",
            x: end.x,
            y: end.y,
          });
          await refreshFrame();
        } catch (error) {
          setConnection(false);
        }
      }

      screenShell.addEventListener("pointerup", async (event) => {
        event.preventDefault();
        await releasePointer(event);
      });

      screenShell.addEventListener("pointercancel", async () => {
        await releasePointer(null);
      });

      sideButton.addEventListener("click", async () => {
        sideButton.classList.add("pressed");
        try {
          await post("/api/side-button", { action: "press-and-release", delay: 0.1 });
          await refreshFrame();
        } catch (error) {
          setConnection(false);
        } finally {
          window.setTimeout(() => sideButton.classList.remove("pressed"), 100);
        }
      });

      refreshFrame();
      window.setInterval(refreshFrame, 140);
    </script>
  </body>
</html>
