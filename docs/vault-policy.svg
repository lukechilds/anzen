  <path d="M1008 1118 H1270 V1140" fill="none" stroke="#c23d4b" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="824" y="1148" width="330" height="144" fill="#edf9f2" stroke="#15804a" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="839" y="1163" width="100" height="30" fill="#15804a"/>
  <text x="889" y="1184" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">EXECUTE</text>
  <text x="1050" y="1190" text-anchor="middle" class="subheading green">WITHDRAW</text>
