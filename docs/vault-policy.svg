  </g>
  <g transform="translate(582 292)">
    <rect width="158" height="92" rx="8" fill="#eef7fd" stroke="#78aecd" stroke-width="2"/>
    <text x="79" y="27" text-anchor="middle" class="small">MONTH 4</text>
