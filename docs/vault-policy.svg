<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380" role="img" aria-labelledby="title description">
  <title id="title">Anzen annual vault policy and presigned transaction graph</title>
  <desc id="description">A 2.1 bitcoin vault split into twelve confirmed monthly UTXOs and one confirmed remainder UTXO. Each monthly UTXO has conflicting green execute and red revoke transactions. The remainder has a presigned emergency initiation transaction followed by conflicting green withdrawal and red cancellation transactions.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2376a8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15804a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c23d4b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 31px; font-weight: 750; }
      .section-heading { font-size: 23px; font-weight: 750; letter-spacing: 0.3px; }
      .subheading { font-size: 20px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; fill: #526173; }
      .tiny { font-size: 13px; fill: #667488; }
      .amount { font-size: 19px; font-weight: 750; }
      .white { fill: #ffffff; }
      .muted-white { fill: #cbd5e1; }
      .blue { fill: #176b9d; }
      .green { fill: #116b3d; }
      .red { fill: #a92e3b; }
    </style>
  </defs>

  <rect width="1600" height="1380" fill="#f7f9fc"/>

  <!-- Policy summary -->
  <rect x="40" y="32" width="1520" height="118" rx="14" fill="#172033"/>
  <text x="74" y="76" class="heading" fill="#ffffff">Illustrative annual vault policy</text>
  <text x="74" y="112" class="body" fill="#cbd5e1">One HWW approval presigns a year of phone-controlled actions</text>

  <g transform="translate(690 52)">
    <rect width="194" height="76" rx="10" fill="#26344b"/>
    <text x="97" y="29" text-anchor="middle" class="small" fill="#cbd5e1">VAULT BALANCE</text>
    <text x="97" y="58" text-anchor="middle" class="amount" fill="#ffffff">2.1 BTC</text>
  </g>
  <g transform="translate(900 52)">
    <rect width="194" height="76" rx="10" fill="#26344b"/>
    <text x="97" y="29" text-anchor="middle" class="small" fill="#cbd5e1">MONTHLY LIMIT</text>
    <text x="97" y="58" text-anchor="middle" class="amount" fill="#ffffff">0.1 BTC × 12</text>
  </g>
  <g transform="translate(1110 52)">
    <rect width="194" height="76" rx="10" fill="#26344b"/>
    <text x="97" y="29" text-anchor="middle" class="small" fill="#cbd5e1">EMERGENCY LIMIT</text>
    <text x="97" y="58" text-anchor="middle" class="amount" fill="#ffffff">0.5 BTC</text>
  </g>
  <g transform="translate(1320 52)">
    <rect width="206" height="76" rx="10" fill="#26344b"/>
    <text x="103" y="29" text-anchor="middle" class="small" fill="#cbd5e1">SAFETY DELAY</text>
    <text x="103" y="58" text-anchor="middle" class="amount" fill="#ffffff">1 week</text>
  </g>

  <!-- Confirmed on-chain outputs -->
  <rect x="40" y="180" width="1520" height="410" rx="14" fill="#ffffff" stroke="#2376a8" stroke-width="3"/>
  <rect x="40" y="180" width="1520" height="54" rx="14" fill="#e9f4fb"/>
  <path d="M40 220 V234 H1560 V220" fill="#e9f4fb"/>
  <circle cx="72" cy="207" r="8" fill="#2376a8"/>
  <text x="92" y="215" class="section-heading blue">CONFIRMED ON CHAIN</text>
  <text x="446" y="214" class="body">The annual rollover creates 13 independent vault UTXOs</text>

  <text x="72" y="270" class="subheading">12 monthly UTXOs</text>
  <text x="300" y="270" class="small">Each holds the 0.1 BTC limit plus its 162 sat transaction fee</text>

  <!-- Months 1–6 -->
  <g transform="translate(72 292)">
    <rect width="158" height="92" rx="8" fill="#eef7fd" stroke="#78aecd" stroke-width="2"/>
    <text x="79" y="27" text-anchor="middle" class="small">MONTH 1</text>
    <text x="79" y="54" text-anchor="middle" class="amount">0.10000162</text>
    <text x="79" y="76" text-anchor="middle" class="tiny">BTC · vault script</text>
  </g>
