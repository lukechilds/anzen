  <path d="M1180 968 V988 H1008 V1002" fill="none" stroke="#2376a8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1180 988 H1368 V1002" fill="none" stroke="#2376a8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="836" y="1010" width="344" height="82" rx="8" fill="#e9f4fb" stroke="#2376a8" stroke-width="2"/>
  <text x="1008" y="1038" text-anchor="middle" class="small blue" style="font-weight:750">ON CHAIN IF INITIATED</text>
  <text x="1008" y="1068" text-anchor="middle" class="amount">0.50000162 BTC staged</text>

  <rect x="1196" y="1010" width="328" height="82" rx="8" fill="#e9f4fb" stroke="#2376a8" stroke-width="2"/>
  <text x="1360" y="1038" text-anchor="middle" class="small blue" style="font-weight:750">STAYS IN THE VAULT</text>
  <text x="1360" y="1068" text-anchor="middle" class="amount">0.39997011 BTC change</text>

