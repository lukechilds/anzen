  <!-- Legend -->
  <rect x="40" y="1350" width="1520" height="2" fill="#d4dbe4"/>
  <circle cx="68" cy="1367" r="7" fill="#2376a8"/>
  <text x="84" y="1373" class="tiny">Blue solid boxes are confirmed UTXOs</text>
  <rect x="366" y="1359" width="32" height="16" fill="#edf9f2" stroke="#15804a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="410" y="1373" class="tiny">Green dashed boxes execute approved policy</text>
  <rect x="746" y="1359" width="32" height="16" fill="#fff0f2" stroke="#c23d4b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="790" y="1373" class="tiny">Red dashed boxes revoke and return funds to the vault</text>
  <text x="1524" y="1373" text-anchor="end" class="tiny">Illustrative values at 1 sat/vB</text>
