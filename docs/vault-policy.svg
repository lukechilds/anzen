  </g>
  <g transform="translate(752 292)">
    <rect width="158" height="92" rx="8" fill="#eef7fd" stroke="#78aecd" stroke-width="2"/>
    <text x="79" y="27" text-anchor="middle" class="small">MONTH 5</text>
    <text x="79" y="54" text-anchor="middle" class="amount">0.10000162</text>
    <text x="79" y="76" text-anchor="middle" class="tiny">BTC · vault script</text>
  </g>
  <g transform="translate(922 292)">
