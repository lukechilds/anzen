    <text x="79" y="54" text-anchor="middle" class="amount">0.10000162</text>
    <text x="79" y="76" text-anchor="middle" class="tiny">BTC · vault script</text>
  </g>
  <g transform="translate(752 398)">
    <rect width="158" height="92" rx="8" fill="#eef7fd" stroke="#78aecd" stroke-width="2"/>
    <text x="79" y="27" text-anchor="middle" class="small">MONTH 11</text>
    <text x="79" y="54" text-anchor="middle" class="amount">0.10000162</text>
    <text x="79" y="76" text-anchor="middle" class="tiny">BTC · vault script</text>
  </g>
  <g transform="translate(922 398)">
    <rect width="158" height="92" rx="8" fill="#eef7fd" stroke="#78aecd" stroke-width="2"/>
    <text x="79" y="27" text-anchor="middle" class="small">MONTH 12</text>
    <text x="79" y="54" text-anchor="middle" class="amount">0.10000162</text>
    <text x="79" y="76" text-anchor="middle" class="tiny">BTC · vault script</text>
  </g>

  <!-- Remainder -->
  <g transform="translate(1120 292)">
    <rect width="400" height="198" rx="10" fill="#e3f1fa" stroke="#2376a8" stroke-width="3"/>
    <text x="200" y="38" text-anchor="middle" class="subheading blue">REMAINDER UTXO</text>
    <text x="200" y="83" text-anchor="middle" style="font-size:32px;font-weight:780">0.89997378 BTC</text>
    <line x1="45" y1="105" x2="355" y2="105" stroke="#aac9dc" stroke-width="2"/>
    <text x="200" y="136" text-anchor="middle" class="body">Cold funds not assigned to a month</text>
    <text x="200" y="165" text-anchor="middle" class="small">Funds the one emergency path</text>
  </g>

  <text x="72" y="548" class="small">Rollover input: 2.1 BTC</text>
  <text x="280" y="548" class="small">Monthly UTXOs: 1.20001944 BTC total</text>
  <text x="638" y="548" class="small">Remainder: 0.89997378 BTC</text>
  <text x="934" y="548" class="small">Rollover fee: 678 sats</text>
  <text x="1170" y="548" class="small">Fee rate: 1 sat/vB</text>

  <!-- Presigned transaction package -->
  <rect x="40" y="626" width="1520" height="706" fill="#ffffff" stroke="#667488" stroke-width="3" stroke-dasharray="14 10"/>
  <rect x="64" y="608" width="635" height="40" fill="#f7f9fc"/>
  <text x="76" y="637" class="section-heading">OFF CHAIN · PRESIGNED TRANSACTION PACKAGE</text>
  <text x="1518" y="637" text-anchor="end" class="small">Dashed square borders = signed transactions stored by the phone</text>

  <line x1="800" y1="668" x2="800" y2="1294" stroke="#d4dbe4" stroke-width="2"/>

  <!-- Monthly conflict pairs -->
  <text x="76" y="694" class="section-heading">MONTHLY PATH · 12 CONFLICTING PAIRS</text>
  <text x="76" y="723" class="small">Every confirmed monthly UTXO has its own execute/revoke pair</text>

  <rect x="76" y="746" width="688" height="58" rx="8" fill="#e9f4fb" stroke="#78aecd" stroke-width="2"/>
  <text x="420" y="782" text-anchor="middle" class="subheading">Any monthly UTXO · 0.10000162 BTC</text>

  <!-- Monthly fork arrows -->
  <path d="M420 804 V837 H231 V866" fill="none" stroke="#15804a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M420 837 H609 V866" fill="none" stroke="#c23d4b" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="76" y="874" width="310" height="248" fill="#edf9f2" stroke="#15804a" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="91" y="889" width="116" height="30" fill="#15804a"/>
  <text x="149" y="910" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">EXECUTE</text>
  <text x="231" y="953" text-anchor="middle" class="subheading green">AUTHORIZE</text>
  <text x="231" y="988" text-anchor="middle" style="font-size:25px;font-weight:780;fill:#116b3d">0.1 BTC → HOT</text>
  <line x1="110" y1="1008" x2="352" y2="1008" stroke="#a8d8bc" stroke-width="2"/>
  <text x="105" y="1041" class="body">Valid:</text>
  <text x="167" y="1041" class="body" style="font-weight:700">1st at 00:00 UTC</text>
  <text x="105" y="1072" class="small">Input: 0.10000162 BTC</text>
  <text x="105" y="1097" class="small">Output: 0.10000000 BTC · fee 162 sats</text>

  <rect x="454" y="874" width="310" height="248" fill="#fff0f2" stroke="#c23d4b" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="469" y="889" width="110" height="30" fill="#c23d4b"/>
  <text x="524" y="910" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">REVOKE</text>
  <text x="609" y="953" text-anchor="middle" class="subheading red">CANCEL ALLOWANCE</text>
  <text x="609" y="988" text-anchor="middle" style="font-size:25px;font-weight:780;fill:#a92e3b">0.1 BTC → VAULT</text>
  <line x1="488" y1="1008" x2="730" y2="1008" stroke="#e5b2b8" stroke-width="2"/>
  <text x="483" y="1041" class="body">Valid:</text>
  <text x="545" y="1041" class="body" style="font-weight:700">immediately</text>
  <text x="483" y="1072" class="small">Input: the same monthly UTXO</text>
  <text x="483" y="1097" class="small">Output: 0.10000000 BTC · fee 162 sats</text>

  <g transform="translate(361 1147)">
    <rect width="118" height="42" rx="21" fill="#172033"/>
    <text x="59" y="28" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">CONFLICT</text>
  </g>
  <path d="M361 1168 H300" stroke="#172033" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M479 1168 H540" stroke="#172033" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="420" y="1222" text-anchor="middle" class="body" style="font-weight:700">Both spend the same UTXO</text>
  <text x="420" y="1250" text-anchor="middle" class="small">Whichever confirms first permanently invalidates the other</text>
  <text x="420" y="1283" text-anchor="middle" class="small">×12 — one independent pair for every calendar month</text>

  <!-- Emergency path -->
  <text x="836" y="694" class="section-heading">EMERGENCY PATH · ONCE PER EPOCH</text>
  <text x="836" y="723" class="small">Initiation spends the remainder, then starts the one-week safety window</text>

  <rect x="836" y="746" width="688" height="58" rx="8" fill="#e9f4fb" stroke="#78aecd" stroke-width="2"/>
  <text x="1180" y="782" text-anchor="middle" class="subheading">Remainder UTXO · 0.89997378 BTC</text>

  <path d="M1180 804 V836" fill="none" stroke="#15804a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="972" y="844" width="416" height="124" fill="#edf9f2" stroke="#15804a" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="987" y="859" width="90" height="30" fill="#15804a"/>
  <text x="1032" y="880" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">EXECUTE</text>
  <text x="1227" y="883" text-anchor="middle" class="subheading green">INITIATE EMERGENCY ACCESS</text>
  <text x="1180" y="923" text-anchor="middle" class="body">Spend remainder now · fee 205 sats</text>
  <text x="1180" y="951" text-anchor="middle" class="small">Creates two confirmed outputs below</text>

