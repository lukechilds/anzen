  <rect x="1194" y="1148" width="330" height="144" fill="#fff0f2" stroke="#c23d4b" stroke-width="3" stroke-dasharray="10 7"/>
  <rect x="1209" y="1163" width="96" height="30" fill="#c23d4b"/>
  <text x="1257" y="1184" text-anchor="middle" class="small" fill="#ffffff" style="font-weight:750">REVOKE</text>
  <text x="1435" y="1190" text-anchor="middle" class="subheading red">CANCEL</text>
  <text x="1359" y="1225" text-anchor="middle" style="font-size:23px;font-weight:780;fill:#a92e3b">0.5 BTC → VAULT</text>
  <text x="1359" y="1256" text-anchor="middle" class="body" style="font-weight:700">Valid immediately</text>
  <text x="1359" y="1281" text-anchor="middle" class="small">Fee: 162 sats</text>

  <g transform="translate(1134 1198)">
    <circle cx="40" cy="22" r="31" fill="#172033"/>
    <text x="40" y="17" text-anchor="middle" class="tiny" fill="#ffffff" style="font-weight:750">SAME</text>
