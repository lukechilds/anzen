<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anzen — Clarity</title>
  <link rel="stylesheet" href="clarity.css">
  <script src="clarity.js" defer></script>
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="island" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <div class="status-icons"><svg viewBox="0 0 18 12"><path d="M1 8h2v4H1zm4-3h2v7H5zm4-2h2v9H9zm4-3h2v12h-2z"/></svg><svg viewBox="0 0 17 12"><path d="M1 3.5a11 11 0 0 1 15 0M3.8 6.4a7 7 0 0 1 9.4 0M6.6 9.2a3 3 0 0 1 3.8 0" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="11" r="1"/></svg><div class="battery"></div></div>
      </div>
      <header class="app-header"></header>
      <main id="content" tabindex="-1"></main>
      <nav class="navigation" aria-label="Main navigation">
        <button data-view="home" aria-current="page"><span data-icon="phone" aria-hidden="true"></span><span>Wallet</span></button>
        <button data-view="vault"><span data-icon="lock" aria-hidden="true"></span><span>Vault</span></button>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
      <div id="modal-layer" class="modal-layer" hidden>
        <div class="scrim" data-close></div>
        <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></section>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </div>
  <p class="prototype-note">Interactive concept · fictional balances · no real transactions<br>Vault reveal is a privacy preview, not device authentication.<br><a href="compare.html">Compare all three designs</a> <span>·</span> <button id="reset">Reset demo</button></p>
</body>
</html>
