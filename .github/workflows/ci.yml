name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.85.0

      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-rust-1.85-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run unit and CLI tests
        run: cargo test --all-targets --locked

  real-node-tests:
    name: Real Bitcoin Core integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached integration-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: vault-tests:local
          cache-from: |
            type=gha,scope=vault-tests
            type=gha,scope=vault-runtime
          cache-to: type=gha,mode=max,scope=vault-tests,timeout=20m,ignore-error=true

      - name: Run Dockerized integration suite
        run: ./scripts/run-tests.sh
        env:
          VAULT_SKIP_DOCKER_BUILD: "1"

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build cached E2E image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: vault-demo:local
          cache-from: |
            type=gha,scope=vault-runtime
            type=gha,scope=vault-tests
          cache-to: type=gha,mode=max,scope=vault-runtime,timeout=20m,ignore-error=true

      - name: Run every isolated test serially
        run: ./scripts/run-e2e.sh all
        env:
          VAULT_SKIP_DOCKER_BUILD: "1"
