<svg
  xmlns="http://www.w3.org/2000/svg"
  width="532"
  height="1008"
  viewBox="0 0 532 1008"
  role="img"
  aria-label="The on-chain structure of a 2.1 BTC vault after the annual ceremony: twelve 0.1 BTC monthly UTXOs, each with a presigned monthly allowance execution and revocation, plus a 0.9 BTC remainder whose presigned emergency trigger would stage 0.5 BTC for withdrawal after a one-week delay alongside 0.4 BTC of cold change."
>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #171717;
      --dim: #737373;
      --rule: #e5e5e5;
      --accent: #0ea5e9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #e5e5e5;
        --dim: #737373;
        --rule: #262626;
        --accent: #38bdf8;
      }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      text-anchor: middle;
    }
    .d-note {
      fill: var(--dim);
      font-size: 12px;
    }
    .d-utxo rect {
      fill: var(--bg);
      stroke: var(--accent);
      stroke-width: 1.5;
    }
    .d-utxo.future rect {
      stroke-dasharray: 4 3;
    }
    .d-utxo text {
      fill: var(--fg);
      font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .d-branchline {
      fill: none;
      stroke: var(--dim);
      stroke-opacity: 0.55;
      stroke-width: 1.25;
    }
    .d-branch {
      fill: var(--dim);
      font-size: 11.5px;
      text-anchor: start;
    }
    .d-tx rect {
      fill: var(--bg);
      stroke: var(--dim);
      stroke-opacity: 0.45;
      stroke-width: 1.25;
    }
    .d-tx text {
      fill: var(--dim);
      font-size: 10.5px;
      text-anchor: start;
    }
    .d-tx .d-when {
      text-anchor: end;
    }
    .d-ok circle,
    .d-no circle {
      fill: var(--bg);
      stroke: var(--dim);
      stroke-opacity: 0.45;
      stroke-width: 1.25;
    }
    .d-ok path {
      fill: none;
      stroke: #22c55e;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .d-no line {
      stroke: #ef4444;
      stroke-width: 1.2;
      stroke-linecap: round;
    }
  </style>
