<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Anzen annual vault rollover layout</title>
  <desc id="desc">A confirmed 2.1 bitcoin vault is spent by the annual rollover. The rollover creates an allowance vault state and monthly connector, plus a vault remainder and emergency connector. Each pair feeds an independent presigned policy chain.</desc>
  <defs>
    <marker id="arrow-neutral" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#737373"/></marker>
    <marker id="arrow-vault" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#0ea5e9"/></marker>
    <marker id="arrow-connector" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#b7791f"/></marker>
  </defs>
  <style>
    :root { --bg:#fff; --panel:#fafafa; --fg:#171717; --dim:#737373; --rule:#d4d4d4; --vault:#0ea5e9; --connector:#b7791f; --execute:#16a34a; }
    @media (prefers-color-scheme:dark) { :root { --bg:#0a0a0a; --panel:#0a0a0a; --fg:#e5e5e5; --dim:#737373; --rule:#262626; --vault:#38bdf8; --connector:#c99a55; --execute:#42c470; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; text-anchor:start; }
    .title { fill:var(--fg); font-size:22px; font-weight:650; letter-spacing:.02em; }
    .subtitle { fill:var(--dim); font-size:12px; }
    .label { fill:var(--fg); font-size:14px; font-weight:650; text-anchor:middle; }
    .small { fill:var(--dim); font-size:10px; text-anchor:middle; }
    .tiny { fill:var(--dim); font-size:9px; text-anchor:middle; }
    .panel { fill:var(--panel); stroke:var(--rule); stroke-width:1.25; }
    .vault circle { fill:var(--bg); stroke:var(--vault); stroke-width:1.6; }
    .vault.future circle { stroke-dasharray:5 4; }
    .connector circle { fill:var(--bg); stroke:var(--connector); stroke-width:1.5; }
    .connector.future circle { stroke-dasharray:5 4; }
    .connector text { fill:var(--connector); font:650 11px ui-monospace,SFMono-Regular,Menlo,monospace; text-anchor:middle; }
    .tx rect { fill:var(--bg); stroke:var(--dim); stroke-width:1.4; }
    .chain rect { fill:var(--bg); stroke:var(--execute); stroke-width:1.4; stroke-dasharray:5 4; }
    .neutral { fill:none; stroke:var(--dim); stroke-width:1.4; marker-end:url(#arrow-neutral); }
    .vault-line { fill:none; stroke:var(--vault); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-vault); }
    .connector-line { fill:none; stroke:var(--connector); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-connector); }
  </style>

  <rect width="1000" height="500" fill="var(--bg)"/>
  <text class="title" x="35" y="43">ANNUAL ROLLOVER</text>
  <text class="subtitle" x="35" y="64">one confirmed transaction creates two independent policy chains</text>

  <g aria-label="Example policy">
    <rect class="panel" x="730" y="18" width="235" height="62" rx="13"/>
    <text class="small" x="747" y="39" style="text-anchor:start;font-weight:650;fill:var(--fg)">EXAMPLE POLICY</text>
    <text class="tiny" x="747" y="57" style="text-anchor:start">2.1 BTC · 0.1 BTC monthly · 0.5 BTC emergency</text>
  </g>

  <rect class="panel" x="25" y="100" width="950" height="330" rx="18"/>

  <g class="vault" aria-label="Confirmed source vault">
    <circle cx="127.5" cy="251" r="61"/>
    <text class="label" x="127.5" y="245">2.1 BTC VAULT</text>
    <text class="small" x="127.5" y="268">confirmed on-chain</text>
  </g>

  <path class="neutral" d="M188.5 251H280"/>
  <g class="tx" aria-label="Confirmed annual rollover transaction">
    <rect x="288" y="211" width="160" height="80" rx="14"/>
    <text class="label" x="368" y="244">ROLLOVER</text>
    <text class="small" x="368" y="265">confirmed transaction</text>
  </g>

  <path class="vault-line" d="M448 241C500 241 495 162 550 162"/>
  <path class="vault-line" d="M448 261C500 261 495 338 550 338"/>

  <g class="vault" aria-label="Confirmed monthly allowance vault state">
    <circle cx="638" cy="162" r="56"/>
    <text class="label" x="638" y="154">≈1.2 BTC</text>
    <text class="small" x="638" y="175">allowance vault state</text>
  </g>
  <g class="vault" aria-label="Confirmed emergency remainder vault state">
    <circle cx="638" cy="338" r="56"/>
    <text class="label" x="638" y="330">≈0.9 BTC</text>
    <text class="small" x="638" y="351">vault remainder</text>
  </g>

  <rect class="panel" x="746" y="103" width="92" height="294" rx="15"/>
  <text class="tiny" x="792" y="122" style="font-weight:650;fill:var(--fg)">CONTROLLER</text>
  <text class="tiny" x="792" y="135">WALLET</text>
  <g class="connector" aria-label="Confirmed monthly connector">
    <circle cx="792" cy="178" r="25"/>
    <text x="792" y="182">Cₘ</text>
    <text class="tiny" x="792" y="216">1k sats</text>
  </g>
  <g class="connector" aria-label="Confirmed emergency connector">
    <circle cx="792" cy="333" r="25"/>
    <text x="792" y="337">Cₑ</text>
    <text class="tiny" x="792" y="371">1k sats</text>
  </g>

  <path class="connector-line" d="M448 251C535 251 690 178 761 178"/>
  <path class="connector-line" d="M448 251C535 251 690 333 761 333"/>

  <path class="vault-line" d="M694 162H850"/>
  <path class="connector-line" d="M817 178H850"/>
  <g class="chain" aria-label="Presigned monthly chain">
    <rect x="858" y="126" width="92" height="72" rx="13"/>
    <text class="label" x="904" y="153" style="font-size:12px">MONTHLY</text>
    <text class="small" x="904" y="171">12 presigned</text>
    <text class="small" x="904" y="185">transactions</text>
  </g>

  <path class="vault-line" d="M694 338H850"/>
  <path class="connector-line" d="M817 333H850"/>
  <g class="chain" aria-label="Presigned emergency chain">
    <rect x="858" y="302" width="92" height="72" rx="13"/>
    <text class="label" x="904" y="329" style="font-size:12px">EMERGENCY</text>
    <text class="small" x="904" y="347">trigger and</text>
    <text class="small" x="904" y="361">withdrawal</text>
  </g>

  <g aria-label="Diagram key">
    <text class="tiny" x="55" y="461" style="text-anchor:start;font-weight:650;fill:var(--fg)">KEY</text>
    <circle cx="117" cy="458" r="12" fill="var(--bg)" stroke="var(--vault)" stroke-width="1.4"/>
    <text class="tiny" x="145" y="462" style="text-anchor:start">vault UTXO</text>
    <circle cx="245" cy="458" r="11" fill="var(--bg)" stroke="var(--connector)" stroke-width="1.4"/>
    <text class="tiny" x="265" y="462" style="text-anchor:start">connector UTXO</text>
    <rect x="390" y="447" width="42" height="22" rx="5" fill="var(--bg)" stroke="var(--dim)" stroke-width="1.3"/>
    <text class="tiny" x="444" y="462" style="text-anchor:start">transaction</text>
    <text class="tiny" x="965" y="462" style="text-anchor:end">round principal amounts; fees and connector reserves omitted</text>
  </g>
</svg>
