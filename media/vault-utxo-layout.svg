<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Anzen annual vault transaction graph</title>
  <desc id="description">A 2.1 bitcoin vault has one confirmed 1.20002417 bitcoin allowance-chain output and one confirmed 0.89997378 bitcoin remainder. Each allowance authorization waits about 30 days, sends 0.1 bitcoin hot, and creates the next chain output. Its immediate conflicting revocation returns the entire remaining chain to the vault and invalidates all descendants. The remainder can trigger a 0.5 bitcoin emergency withdrawal with a one-week delay or immediate cancellation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="var(--line)" />
    </marker>
  </defs>
  <style>
    :root { --bg:#fff; --fg:#171717; --muted:#666; --line:#8a8a8a; --rule:#d4d4d4; --blue:#0284c7; --green:#16a34a; --red:#dc2626; --green-bg:#f0fdf4; --red-bg:#fef2f2; --blue-bg:#f0f9ff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0a0a; --fg:#ededed; --muted:#a3a3a3; --line:#737373; --rule:#404040; --blue:#38bdf8; --green:#4ade80; --red:#f87171; --green-bg:#092d18; --red-bg:#351010; --blue-bg:#082f49; } }
    .background { fill:var(--bg); }
    text { fill:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
    .title { font-size:22px; font-weight:700; }
    .subtitle { fill:var(--muted); font-size:13px; }
    .section { font-size:13px; font-weight:650; }
    .small { fill:var(--muted); font-size:11px; }
    .label { font-size:12px; font-weight:650; }
    .amount { font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .utxo rect { fill:var(--blue-bg); stroke:var(--blue); stroke-width:1.5; }
    .future rect { stroke-dasharray:6 4; }
    .tx rect { stroke-width:1.5; }
    .execute rect { fill:var(--green-bg); stroke:var(--green); }
    .revoke rect { fill:var(--red-bg); stroke:var(--red); }
    .neutral rect { fill:var(--bg); stroke:var(--line); }
    .graph { fill:none; stroke:var(--rule); stroke-width:1.5; stroke-dasharray:7 5; }
    .arrow { fill:none; stroke:var(--line); stroke-width:1.4; marker-end:url(#arrow); }
    .conflict { fill:none; stroke:var(--red); stroke-width:1.2; stroke-dasharray:3 3; }
    .execute-text { fill:var(--green); }
    .revoke-text { fill:var(--red); }
  </style>

  <rect class="background" width="960" height="720" />
  <text class="title" x="30" y="36">2.1 BTC annual vault policy</text>
  <text class="subtitle" x="30" y="59">0.1 BTC allowance every ≥30 days · up to 12 hops · 0.5 BTC emergency access after ≥1 week</text>

  <text class="section" x="30" y="95">Confirmed on-chain after annual rollover</text>
  <g class="utxo">
    <rect x="30" y="112" width="180" height="66" rx="10" />
    <text class="label" x="46" y="136">Allowance chain · step 1</text>
    <text class="amount" x="46" y="160">1.20002417 BTC</text>
  </g>
  <g class="utxo">
    <rect x="30" y="505" width="180" height="66" rx="10" />
    <text class="label" x="46" y="529">Emergency remainder</text>
    <text class="amount" x="46" y="553">0.89997378 BTC</text>
  </g>

  <rect class="graph" x="240" y="82" width="690" height="382" rx="14" />
  <text class="section" x="258" y="108">Presigned allowance graph · encrypted on phone</text>
  <text class="small" x="905" y="108" text-anchor="end">dashed UTXOs do not exist until their parent confirms</text>

  <path class="arrow" d="M210 132 H270" />
  <path class="arrow" d="M210 158 C235 158 240 218 270 218" />
  <g class="tx execute">
    <rect x="270" y="120" width="215" height="58" rx="9" />
    <text class="label execute-text" x="286" y="143">Authorize step 1</text>
    <text class="small" x="286" y="163">valid ≥30 days after rollover confirms</text>
  </g>
  <g class="tx revoke">
    <rect x="270" y="196" width="215" height="58" rx="9" />
    <text class="label revoke-text" x="286" y="219">Revoke at step 1</text>
    <text class="small" x="286" y="239">valid immediately · cancels steps 1–12</text>
  </g>
  <path class="conflict" d="M258 149 V225" />
  <text class="small revoke-text" x="251" y="188" text-anchor="end">conflict</text>

  <path class="arrow" d="M485 135 C520 135 520 132 555 132" />
  <path class="arrow" d="M485 163 C520 163 520 207 555 207" />
  <g class="utxo">
    <rect x="555" y="116" width="154" height="42" rx="8" />
    <text class="amount" x="632" y="142" text-anchor="middle">0.1 BTC hot</text>
  </g>
  <g class="utxo future">
    <rect x="555" y="184" width="154" height="50" rx="8" />
    <text class="label" x="632" y="204" text-anchor="middle">Chain · step 2</text>
    <text class="amount" x="632" y="223" text-anchor="middle">1.10002212 BTC</text>
  </g>
  <path class="arrow" d="M485 225 C520 225 520 271 555 271" />
  <g class="utxo future">
    <rect x="555" y="250" width="154" height="42" rx="8" />
    <text class="label revoke-text" x="632" y="269" text-anchor="middle">Back to vault</text>
    <text class="small" x="632" y="284" text-anchor="middle">entire remaining chain</text>
  </g>

  <path class="arrow" d="M709 209 H750" />
  <g class="tx execute">
    <rect x="750" y="180" width="154" height="58" rx="9" />
    <text class="label execute-text" x="827" y="203" text-anchor="middle">Authorize step 2</text>
    <text class="small" x="827" y="223" text-anchor="middle">another ≥30 days</text>
  </g>
  <text class="title" x="827" y="277" text-anchor="middle">⋮</text>
  <g class="tx execute">
    <rect x="750" y="300" width="154" height="58" rx="9" />
    <text class="label execute-text" x="827" y="323" text-anchor="middle">Authorize step 12</text>
    <text class="small" x="827" y="343" text-anchor="middle">0.1 BTC hot · chain ends</text>
  </g>
  <g class="tx revoke">
    <rect x="555" y="334" width="154" height="58" rx="9" />
    <text class="label revoke-text" x="632" y="357" text-anchor="middle">Revoke live hop</text>
    <text class="small" x="632" y="377" text-anchor="middle">cancels every descendant</text>
  </g>
  <path class="arrow" d="M632 234 V334" />
  <text class="small" x="258" y="436">Only one chain UTXO is live. A later step's 30-day clock starts only when the previous authorization confirms.</text>

  <rect class="graph" x="240" y="485" width="690" height="205" rx="14" />
  <text class="section" x="258" y="511">Presigned emergency graph · independent of the allowance chain</text>
  <path class="arrow" d="M210 538 H270" />
  <g class="tx neutral">
    <rect x="270" y="520" width="150" height="52" rx="9" />
    <text class="label" x="345" y="542" text-anchor="middle">Trigger</text>
    <text class="small" x="345" y="560" text-anchor="middle">valid immediately</text>
  </g>
  <path class="arrow" d="M420 538 H470" />
  <path class="arrow" d="M420 558 C445 558 445 637 470 637" />
  <g class="utxo future">
    <rect x="470" y="520" width="155" height="52" rx="8" />
    <text class="label" x="547" y="542" text-anchor="middle">Staging output</text>
    <text class="amount" x="547" y="561" text-anchor="middle">0.50000162 BTC</text>
  </g>
  <g class="utxo future">
    <rect x="470" y="614" width="155" height="46" rx="8" />
    <text class="label" x="547" y="634" text-anchor="middle">Cold change</text>
    <text class="amount" x="547" y="652" text-anchor="middle">0.39997011 BTC</text>
  </g>
  <path class="arrow" d="M625 538 H670" />
  <path class="arrow" d="M625 554 C650 554 650 628 670 628" />
  <g class="tx execute">
    <rect x="670" y="520" width="225" height="52" rx="9" />
    <text class="label execute-text" x="686" y="542">Withdraw 0.5 BTC hot</text>
    <text class="small" x="686" y="560">valid ≥1 week after trigger confirms</text>
  </g>
  <g class="tx revoke">
    <rect x="670" y="604" width="225" height="52" rx="9" />
    <text class="label revoke-text" x="686" y="626">Cancel back to vault</text>
    <text class="small" x="686" y="644">valid immediately · conflicts with withdrawal</text>
  </g>

  <text class="small" x="30" y="704">Amounts include fixed 1 sat/vB MVP fees. Green executes policy; red revokes it.</text>
</svg>
